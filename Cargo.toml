[package]
name = "slot-cart-studio"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
crc32fast = "1"
fontdue = "0.9"
png = "0.17"
resvg = { version = "0.48", default-features = false }
usvg = { version = "0.48", default-features = false }
wasm-bindgen = "0.2"
# From the slot checkout beside this one. Only `Cart` is used: it is what slot's `cart_face`
# takes.
slot-store = { path = "../slot/crates/slot-store" }

# Native only. slot-ui cannot build for wasm32; it is here so the tests can hold every face
# the studio draws to the one slot draws.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
slot-ui = { path = "../slot/crates/slot-ui" }
tempfile = "3"
